
name: Deploy To Ubuntu

on:
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java Version
        run: |
          java -version
          javac -version

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Locate Application JAR
        id: jar
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*.original' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No application JAR found"
            ls -la target/
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"
          echo "Found JAR: $JAR_FILE"

      - name: Prepare Deployment Directory
        run: |
          DEPLOY_DIR="$HOME/spring-demo"
          mkdir -p "$DEPLOY_DIR"
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Stop Old Application
        run: |
          if [ -f "$DEPLOY_DIR/app.pid" ]; then
            PID=$(cat "$DEPLOY_DIR/app.pid")

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"
              for i in {1..10}; do
                kill -0 "$PID" 2>/dev/null || break
                sleep 1
              done

              if kill -0 "$PID" 2>/dev/null; then
                echo "Old application did not stop"
                exit 1
              fi
            fi

            rm -f "$DEPLOY_DIR/app.pid"
          fi

      - name: Copy New Application
        run: |
          cp "$JAR_FILE" "$DEPLOY_DIR/app.jar"
          echo "Application copied successfully"

      - name: Start Application
        run: |
          cd "$DEPLOY_DIR"

          RUNNER_TRACKING_ID="" nohup java -jar app.jar \
            > app.log 2>&1 &

          echo $! > app.pid

      - name: Verify Deployment
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/hello; then
              echo ""
              echo "Deployment successful!"
              exit 0
            fi

            sleep 2
          done

          echo "Application failed to start. Logs:"
          cat "$DEPLOY_DIR/app.log"
          exit 1
